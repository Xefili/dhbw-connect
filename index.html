<!doctype html>
<html lang="de" class="background">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="DHBW Connect Startseite" />
    <link rel="shortcut icon" href="/logo.svg" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DHBW-Connect</title>
    <!-- VT323: free pixel font (SIL OFL), used by the Blockwelt theme only -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint. Key and theme ids must match src/composables/useTheme.js.
      (function () {
        var themes = ['standard', 'alt', 'leibniz', 'cocoa', 'cake', 'terminal', 'oled', 'blocky'];
        var theme = 'standard';
        try {
          var stored = localStorage.getItem('dhbw-connect-theme');
          if (themes.indexOf(stored) !== -1) theme = stored;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body class="text-text-bg-l dark:text-text-bg-d">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
