<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- DHBW Red Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2001A" />
      <stop offset="100%" stop-color="#990011" />
    </linearGradient>

    <!-- App Node Gradients -->
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="nodeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
  </defs>

  <!-- Background Container for High Visibility -->
  <rect width="64" height="64" rx="14" fill="#0F172A" />

  <!-- Connection Lines -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="#475569" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="12" y1="32" x2="52" y2="32" stroke="#475569" stroke-width="2" stroke-dasharray="2 2" />

  <!-- Outer Satellite App Nodes -->
  <!-- Top Node -->
  <circle cx="32" cy="11" r="5" fill="url(#nodeBlue)" />
  <!-- Right Node -->
  <circle cx="53" cy="32" r="5" fill="url(#nodeOrange)" />
  <!-- Bottom Node -->
  <circle cx="32" cy="53" r="5" fill="url(#nodeGreen)" />
  <!-- Left Node -->
  <circle cx="11" cy="32" r="5" fill="url(#nodePurple)" />

  <!-- Center Hub Container -->
  <circle cx="32" cy="32" r="16" fill="#1E293B" stroke="url(#primaryGrad)" stroke-width="2.5" />

  <!-- Interlocking Double 'C' Logo Center Piece -->
  <!-- Inner Red 'C' -->
  <path d="M 33 24 C 27 24 24 27 24 32 C 24 37 27 40 33 40" 
        fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Inner White 'C' -->
  <path d="M 31 40 C 37 40 40 37 40 32 C 40 27 37 24 31 24" 
        fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
</svg>